name: CI & Release Validation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Repository Scripts & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck on Install Script
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          file: 'install'

      - name: Validate Install Script Syntax
        run: bash -n install

      - name: Check README local links
        run: |
          fail=0
          refs="$(grep -o '](\./[^)]*)' README.md | sed 's/](//;s/)$//' || true)
          $(grep -oE '(src|srcset)="\./[^"]*"' README.md | sed 's/.*="//;s/"$//' || true)"
          for link in $refs; do
            path="${link#./}"
            if [ ! -e "$path" ]; then
              echo "::error::README.md references a missing file: $link"
              fail=1
            fi
          done
          exit $fail
